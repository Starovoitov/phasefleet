name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o bin/ ./cmd/sim ./cmd/node ./cmd/sink
