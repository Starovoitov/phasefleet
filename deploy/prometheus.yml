global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: sink
    static_configs:
      - targets: ["sink:8080"]
  - job_name: nodes
    static_configs:
      - targets: ["node-a:9100"]
        labels: {id: a}
      - targets: ["node-b:9100"]
        labels: {id: b}
      - targets: ["node-c:9100"]
        labels: {id: c}
      - targets: ["node-d:9100"]
        labels: {id: d}
      - targets: ["node-e:9100"]
        labels: {id: e}
      - targets: ["node-f:9100"]
        labels: {id: f}
