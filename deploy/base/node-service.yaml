apiVersion: v1
kind: Service
metadata:
  name: node
  labels:
    app: node
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: node
  ports:
    - name: gossip
      port: 9000
      targetPort: gossip
      protocol: UDP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
